# Local development stack: MinIO (S3-compatible storage) + the backend.
#
#   docker compose up -d --build        # API on http://localhost:8080/api
#   cd frontend && npm run start:local-backend
#
# Set DEV_BYPASS_AUTH=true (e.g. `DEV_BYPASS_AUTH=true docker compose up -d`) to
# use fake dev users instead of real sign-in. MinIO console: http://localhost:9001
# (minioadmin / minioadmin).
#
# The official minio/minio and minio/mc images are no longer published on Docker
# Hub, so this uses pgsty/minio, a maintained community build of the same MinIO
# server that also ships the mc client (used by the bucket-creation step).

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: create the data bucket, then exit.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/scribe-local
      "

  backend:
    build: ./backend
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_URL: http://localhost:8080/api
      FRONTEND_URL: http://localhost:3000
      DATA_BUCKET: scribe-local
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-402914910938-47o6ff5rkig658lr4k51rmrmlbm4s4qg.apps.googleusercontent.com}
      TURNSTILESECRET: ${TURNSTILESECRET:-local-dev-placeholder}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-false}

volumes:
  minio-data:
